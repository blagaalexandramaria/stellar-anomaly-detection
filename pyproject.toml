[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-anomaly-detection"
version = "0.1.0"
description = "Physics-informed multi-view analysis for unsupervised stellar anomaly ranking"
authors = [
  { name = "Alexandra-Maria Blaga" },
  { name = "Răzvan Octavian Mihuț" },
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "astropy>=8.0,<9",
  "numpy>=2.4,<2.5",
  "pandas>=3.0,<4",
  "scipy>=1.17,<1.18",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Repository = "https://github.com/blagaalexandramaria/stellar-anomaly-detection"

[project.optional-dependencies]
ml = ["scikit-learn>=1.8,<1.9"]
ae = ["torch>=2.13,<2.14"]
visualization = ["matplotlib>=3.10,<3.11"]
dev = ["pytest>=9.0,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stellar_anomaly_detection", "stellar_anomaly_detection.*"]

[tool.setuptools.package-data]
stellar_anomaly_detection = ["data/registries/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
